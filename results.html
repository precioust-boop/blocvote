<!-- Bloc-Vote by Precious Temowo -->
<html>

<head>
	<title>Bloc-Vote</title>
	<link rel="stylesheet" href="lib/css/bootstrap.min.css">
</head>

<body>
	<!-- Homepage -->
	<div class="container">
		<br>
		<br>
		<div class="container">
			<div class="row">
				<div class="col-md-4"></div>
				<img src="blocvote.png" alt="">
				<div class="col-md-4"></div>
			</div>
			<br>
			<br>
			<div class="card">
				<div class="card-head">
					<div class="row">
						<div class="col-md-4"></div>
						<div class="col-md-4 text-center">
							<h3 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Election Details
							</h3>
						</div>
						<div class="col-md-4"></div>
					</div>
				</div>
				<div class="card-body">
					<div class="row">
						<div class="col-md-4"></div>
						<div class="col-md-4">
							<h5 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" id="electionName">
							</h5>
							<h5 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;"
								id="numOfCandidates"></h5>
							<h5 style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" id="totalVotes">
							</h5>
							<center>
								<table id="resultsTable" class="table table-striped table-bordered" style="width:100%">
									<thead>
										<tr>
											<th>Candidate Name</th>
											<th>Number of Votes</th>
										</tr>
									</thead>
									<tbody></tbody>
								</table>
								<a href="index.html" class="btn btn-danger text-white" style="width:150px;">Log Out</a>
							</center>
						</div>
						<div class="col-md-4"></div>
					</div>
				</div>
			</div>
		</div>
	</div>



	<script src="lib/js/jquery-3.4.1.min.js"></script>
	<script src="lib/js/popper.min.js"></script>
	<script src="lib/js/bootstrap.min.js"></script>
	<script src="lib/js/web3.min.js"></script>
	<script src="app.js"></script>

	<script>
		console.log(ElectionApp);

		ElectionApp.Contract.methods.electionName().call().then((result) => {
			$("#electionName").html("<b>Election Name: " + result);
		});


		ElectionApp.Contract.methods.getNumofCandidates().call().then((numOfCandidates) => {
			$("#numOfCandidates").html("<b>Number of Candidates: " + numOfCandidates);

			const candidatesPromise = [];
			for (let i = 0; i < numOfCandidates; i++) {
				candidatesPromise.push(ElectionApp.Contract.methods.candidates(i).call());
			}
			let resultsHTML = '';
			Promise.all(candidatesPromise).then((data) => {
				data.sort((a, b) => b.voteCount - a.voteCount);
				data.forEach((value, index) => {
					if (index === 0) {
						resultsHTML += `<tr class="text-white bg-success"><td>${value.name}</td><td>${value.voteCount}</td></tr>`;
					} else {
						resultsHTML += `<tr><td>${value.name}</td><td>${value.voteCount}</td></tr>`;
					}
				});

				$('#resultsTable').find('tbody').html(resultsHTML);
			});
		});

		ElectionApp.Contract.methods.totalVotes().call().then((result) => {
			$("#totalVotes").html("<b>Total Votes: " + result);
		});

	</script>

</body>

</html>
